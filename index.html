<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pl=(n,a)=>{const m=n%100,k=n%10;return a[m>10&&m<20?2:k==1?0:k>1&&k<5?1:2]},P=['страницу','страницы','страниц'],B=['книгу','книги','книг'];
const fd=(d,o)=>d.toLocaleDateString('ru-RU',o);
let S={pages:{},done:{},books:[],cabs:1,rem:'20:00',nf:''},tab=0,rg='w',sel=null,cm=new Date(),sd=null,r1='m',ci=0,mvId=null,dg=null,l3='now',cur=null,fs=18,pi=0,pgN=1,step=1;
cm.setDate(1);
let dbp;const idb=()=>dbp||(dbp=new Promise(r=>{try{const q=indexedDB.open('rd',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}}));
const kv=(m,k,v)=>idb().then(d=>d?new Promise(r=>{try{const t=d.transaction('k',m=='r'?'readonly':'readwrite'),o=t.objectStore('k'),q=m=='r'?o.get(k):o.put(v,k);t.oncomplete=()=>r(m=='r'?q.result:1);t.onerror=t.onabort=()=>r(m=='r'?undefined:0)}catch(e){r(m=='r'?undefined:0)}}):0);
const load=()=>kv('r','s');
const save=()=>kv('w','s',{...S,books:S.books.map(({text,...b})=>b)});
function toast(t){const e=E('div','toast',esc(t));document.body.append(e);setTimeout(()=>e.remove(),2200)}
function modal(h){const o=E('div','ov'),s=E('div','sheet',h),x=E('button','mx','✕');x.onclick=()=>o.remove();s.append(x);o.append(s);o.onclick=e=>{if(e.target==o)o.remove()};document.body.append(o);return o}
function chips(el,list,cur,fn){el.innerHTML='';list.forEach(([k,l])=>{const b=E('button','chip'+(k==cur?' on':''),l);b.onclick=()=>fn(k);el.append(b)})}
const hue=s=>Math.abs([...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360;
function bk(b){const e=E('div','bk');if(b.cover)e.style.backgroundImage=`url(${b.cover})`;else{const h=hue(b.title);e.style.background=`linear-gradient(135deg,hsl(${h} 60% 48%),hsl(${(h+40)%360} 55% 26%))`;e.innerHTML=`<span>${esc(b.title)}</span>`}if(b.fv)e.insertAdjacentHTML('beforeend','<i class="fv">♥</i>');if(b.rt)e.insertAdjacentHTML('beforeend','<i class="rt">★'+b.rt+'</i>');if(b.hp)e.insertAdjacentHTML('beforeend','<i class="hp">🎧</i>');e.draggable=true;e.ondragstart=()=>dg=b.id;return e}

/* ---------- Tab 0 ---------- */
function series(r){const now=new Date(),o=[];
 if(r=='w'||r=='m'){for(let i=(r=='w'?7:30)-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);o.push({l:r=='w'?fd(d,{weekday:'short'}):d.getDate(),v:S.pages[ymd(d)]||0,t:fd(d,{day:'numeric',month:'long'})})}}
 else{const ks=Object.keys(S.pages).sort();const st=r=='y'?new Date(now.getFullYear(),now.getMonth()-11,1):ks.length?new Date(ks[0]+'T00:00'):new Date(now.getFullYear(),now.getMonth(),1);
  for(let d=new Date(st.getFullYear(),st.getMonth(),1);d<=now;d.setMonth(d.getMonth()+1)){const p=d.getFullYear()+'-'+p2(d.getMonth()+1);let v=0;for(const k in S.pages)if(k.startsWith(p))v+=S.pages[k];o.push({l:fd(d,{month:'short'}),v,t:fd(d,{month:'long',year:'numeric'}),m:1})}}
 return o}
let sm='p';
function chartT(){const h=S.hh||Array(24).fill(0),mx=Math.max(1,...h),W=340,H=190,pp=14,bw=(W-2*pp)/24;let s=`<svg viewBox="0 0 ${W} ${H}">`;h.forEach((v,i)=>{const bh=(v/mx)*(H-52),x=pp+i*bw;s+=`<rect x="${x+2}" y="${H-28-bh}" width="${bw-4}" height="${Math.max(2,bh)}" rx="3" fill="${v==mx&&v>0?'#d8bd86':'#4fd1a1'}" opacity="${v?1:.25}"/>`;if(i%3==0)s+=`<text x="${x+bw/2}" y="${H-10}" class="ax" text-anchor="middle">${i}</text>`});$('#ch').innerHTML=s+'</svg>';const tot=h.reduce((a,b)=>a+b,0),pk=h.indexOf(mx);$('#inf').innerHTML=tot?`Чаще всего ты читаешь около <span style="color:var(--ac)">${p2(pk)}:00</span> 🌙<br><small style="color:var(--mu)">По перелистанным страницам в читалке: ${tot}</small>`:'Пока мало данных — читай в приложении, и здесь появится график'}
function chart(){if(sm=='t')return chartT();const d=series(rg);if(sel==null||sel>=d.length)sel=d.length-1;
 const W=340,H=190,p=28,mx=Math.max(1,...d.map(x=>x.v)),X=i=>p+(d.length>1?i*(W-2*p)/(d.length-1):(W-2*p)/2),Y=v=>H-30-v/mx*(H-60),pts=d.map((x,i)=>X(i)+','+Y(x.v)).join(' ');
 let s=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd1a1" stop-opacity=".55"/><stop offset="1" stop-color="#4fd1a1" stop-opacity="0"/></linearGradient></defs>`;
 [0,.5,1].forEach(f=>{const y=Y(mx*f);s+=`<line x1="${p}" x2="${W-p}" y1="${y}" y2="${y}" stroke="#ffffff1f"/><text x="2" y="${y+3}" class="ax">${Math.round(mx*f)}</text>`});
 if(d.length>1)s+=`<polygon points="${X(0)},${H-30} ${pts} ${X(d.length-1)},${H-30}" fill="url(#ga)"/><polyline points="${pts}" fill="none" stroke="#4fd1a1" stroke-width="2.5" stroke-linejoin="round"/>`;
 const st=Math.ceil(d.length/7);
 d.forEach((x,i)=>{if(i%st==0||i==d.length-1&&d.length<8)s+=`<text x="${X(i)}" y="${H-10}" class="ax" text-anchor="middle">${x.l}</text>`;
  s+=`<circle cx="${X(i)}" cy="${Y(x.v)}" r="${i==sel?7:3.5}" fill="${i==sel?'#d8bd86':'#4fd1a1'}" stroke="#4fd1a1" stroke-width="2"/><circle data-i="${i}" cx="${X(i)}" cy="${Y(x.v)}" r="${d.length>20?6:13}" fill="transparent" style="cursor:pointer"/>`});
 $('#ch').innerHTML=s+'</svg>';
 $('#ch').querySelectorAll('[data-i]').forEach(c=>c.onclick=()=>{sel=+c.dataset.i;chart()});
 const x=d[sel],tot=d.reduce((a,y)=>a+y.v,0);
 $('#inf').innerHTML=(x.m?`${x.t[0].toUpperCase()+x.t.slice(1)}: <span style="color:var(--ac)">${x.v} ${pl(x.v,P)}</span>`:`${x.t} я прочитала <span style="color:var(--ac)">${x.v} ${pl(x.v,P)}</span> ✨`)+`<br><small style="color:var(--mu)">Всего за период: ${tot}</small>`}
function R0(){const v=S.pages[ymd(new Date())];$('#dt').textContent=fd(new Date(),{weekday:'long',day:'numeric',month:'long'});
 $('#bn').className='bn'+(v==null?' warn':'');$('#bn').textContent=v==null?'Сегодня ты ещё не записала, сколько прочитала 💌':`Сегодня записано: ${v} ${pl(v,P)} ✨`;
$('#rt').value=S.rem;
 chips($('#c00'),[['p','📖 Страницы'],['t','🕘 Время суток']],sm,k=>{sm=k;R0()});$('#c0').hidden=sm=='t';chips($('#c0'),[['w','Неделя'],['m','Месяц'],['y','Год'],['a','Всё время']],rg,k=>{rg=k;sel=null;R0()});chart()}
$('#sv').onclick=()=>{const v=parseInt($('#pg').value);if(isNaN(v)||v<0)return toast('Введи число страниц');S.pages[ymd(new Date())]=v;save();sel=null;$('#pg').value='';R0();toast('Записано 💖')};

$('#nt').onclick=async()=>{try{const p=await Notification.requestPermission();toast(p=='granted'?'Напоминания включены 🔔':'Разреши уведомления в настройках')}catch(e){toast('Браузер не поддерживает уведомления')}};
function chk(){const n=new Date(),t=ymd(n);if(S.pages[t]==null&&S.nf!=t&&n.getHours()*60+n.getMinutes()>=(+S.rem.slice(0,2))*60+(+S.rem.slice(3))){try{if(Notification.permission=='granted'){ntf('📖 Не забудь записать страницы','Сегодня ты ещё не вводила, сколько прочитала');S.nf=t;save()}}catch(e){}}}

/* ---------- Tab 1 ---------- */
function cnt(r){const t=new Date();let lo='';if(r=='m')lo=ymd(cm).slice(0,7);else if(r!='a'){const d=new Date(t);r=='h'?d.setMonth(d.getMonth()-6):d.setFullYear(d.getFullYear()-1);lo=ymd(d)}let n=0;for(const k in S.done)if(r=='m'?k.startsWith(lo):k>=lo)n+=S.done[k].length;return n}
function R1(){const y=cm.getFullYear(),m=cm.getMonth(),g=$('#cg'),tk=ymd(new Date());$('#mt').textContent=fd(cm,{month:'long',year:'numeric'});g.innerHTML='';
 ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d=>g.append(E('i','wd',d)));

 for(let d=1,n=new Date(y,m+1,0).getDate();d<=n;d++){const k=ymd(new Date(y,m,d)),c=(S.done[k]||[]).length,e=E('button','dy'+((S.pages[k]||0)>=500?' h3':(S.pages[k]||0)>=100?' h2':(S.pages[k]||0)>0?' h1':'')+(c?' c'+Math.min(c,3):'')+(k==sd?' sel':'')+(k==tk?' td':''),d);e.onclick=()=>{sd=k;R1()};g.append(e)}
 $('#dp').hidden=!sd;if(sd){const l=S.done[sd]||[];$('#dh').textContent=fd(new Date(sd+'T00:00'),{day:'numeric',month:'long'})+(S.pages[sd]?' · '+S.pages[sd]+' '+pl(S.pages[sd],['страница','страницы','страниц']):'');const dl=$('#dl');dl.innerHTML=l.length?'':'<p class="sm">В этот день пока ничего не отмечено</p>';
  l.forEach((t,i)=>{const e=E('div','li',`<span>📗 ${esc(t)}</span><button>✕</button>`);e.querySelector('button').onclick=()=>{l.splice(i,1);if(!l.length)delete S.done[sd];save();R1()};dl.append(e)})}
 chips($('#c1'),[['m','Месяц'],['h','Полгода'],['y','Год'],['a','Всё время']],r1,k=>{r1=k;R1()});const n=cnt(r1);
 $('#sn').innerHTML=`${n} <span style="font-size:16px;font-family:Nunito">${pl(n,['книга','книги','книг'])} 📚</span>`}
$('#pm').onclick=()=>{cm.setMonth(cm.getMonth()-1);R1()};$('#nm').onclick=()=>{cm.setMonth(cm.getMonth()+1);R1()};

$('#ab').onclick=()=>{const t=$('#bt').value.trim();if(!t||!sd)return;(S.done[sd]=S.done[sd]||[]).push(t);$('#bt').value='';save();R1()};

/* ---------- Library / lists ---------- */
let ct='';
const TH=()=>S.themes.find(t=>t.id==ct)||S.themes[0];
function initTh(){if(!S.themes||!S.themes.length){const n=Math.max(1,S.cabs||1);S.themes=[{id:'t0',name:'Моя библиотека',cabs:Array.from({length:n},()=>({n:3}))}]}S.books.forEach(b=>{if(b.list=='lib'&&!b.th)b.th=S.themes[0].id});if(!S.themes.some(t=>t.id==ct))ct=S.themes[0].id}
const inTh=(b,t)=>b.list=='lib'&&b.th==t.id;
function place(b){const t=S.themes.find(x=>x.id==b.th)||TH();b.th=t.id;for(let c=0;;c++){if(!t.cabs[c])t.cabs.push({n:3});for(let s=0;s<t.cabs[c].n;s++)if(S.books.filter(x=>inTh(x,t)&&x.cab==c&&x.sh==s&&x!=b).length<4){b.cab=c;b.sh=s;return}}}
function moveTo(id,c,s,bf){const b=S.books.find(x=>x.id==id),t=TH();if(!b)return;if(S.books.filter(x=>inTh(x,t)&&x.cab==c&&x.sh==s&&x!=b).length>=4)return toast('Эта полка уже полная');
 S.books=S.books.filter(x=>x!=b);b.th=t.id;b.cab=c;b.sh=s;const i=bf?S.books.findIndex(x=>x.id==bf):-1;i<0?S.books.push(b):S.books.splice(i,0,b);mvId=null;save();R2()}
function newTheme(){const n=(prompt('Название темы (например, «Фантастика»)')||'').trim();if(!n)return;const t={id:uid(),name:n,cabs:[{n:3}]};S.themes.push(t);ct=t.id;ci=0;save();R2()}
function themeMenu(){const t=TH(),o=modal('<h2></h2>'),s=o.firstChild;s.firstChild.textContent='Тема: '+t.name;
 const r=E('button','btn full sec','✏️ Переименовать');r.onclick=()=>{const n=(prompt('Название темы',t.name)||'').trim();if(n){t.name=n;save();o.remove();R2()}};
 const d=E('button','btn full del','🗑 Удалить тему');d.onclick=()=>{if(S.themes.length<2)return toast('Должна остаться хотя бы одна тема');if(!confirm('Удалить тему? Книги переедут в другую тему.'))return;const to=S.themes.find(x=>x!=t);S.themes=S.themes.filter(x=>x!=t);S.books.filter(b=>b.list=='lib'&&b.th==t.id).forEach(b=>{b.th=to.id;place(b)});ct=to.id;ci=0;save();o.remove();R2()};s.append(r,d)}
