async function record(btn,n){if(rec){rec.stop();return}
 try{const stm=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(stm),parts=[],t0=Date.now();rec=mr;
  mr.ondataavailable=e=>e.data.size&&parts.push(e.data);const iv=setInterval(()=>btn.textContent='⏹ '+Math.floor((Date.now()-t0)/1000)+' с',500);
  mr.onstop=async()=>{clearInterval(iv);stm.getTracks().forEach(t=>t.stop());rec=null;const mt=mr.mimeType||'audio/webm',ext=mt.includes('mp4')?'m4a':mt.includes('ogg')?'ogg':'webm',d=new Date();
   await addItem(n,new Blob(parts,{type:mt}),`Запись ${d.getDate()}.${p2(d.getMonth()+1)} ${p2(d.getHours())}-${p2(d.getMinutes())}.${ext}`,'aud');if(nt==n.id)N();toast('Запись сохранена ✓')};

let px=0;$('#pvi').ontouchstart=e=>px=e.touches[0].clientX;$('#pvi').ontouchend=e=>{const d=e.changedTouches[0].clientX-px;if(Math.abs(d)>50)pvShow(pvI+(d<0?1:-1))};

/* ---------- html preview ---------- */
const ht=$('#hta'),hfr=$('#hfr');
function hvOpen(){$('#hv').hidden=false;ht.value=S.hcode||''}

$('#hb').onclick=()=>{hstop();$('#hv').hidden=true};
